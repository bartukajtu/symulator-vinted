const shopStock=[{name:'Karta piłkarska – Lamine Yamal',category:'Karty piłkarskie',price:8,icon:'⚽'},{name:'Karta piłkarska – Mbappé',category:'Karty piłkarskie',price:6,icon:'⚽'},{name:'Paczka 10 kart piłkarskich',category:'Karty piłkarskie',price:12,icon:'🃏'},{name:'Karta koszykarska',category:'Karty koszykarskie',price:7,icon:'🏀'},{name:'Koszulka piłkarska',category:'Ubrania',price:45,icon:'👕'},{name:'Bluza sportowa',category:'Ubrania',price:55,icon:'🧥'},{name:'EA Sports FC 25',category:'Gry',price:70,icon:'🎮'},{name:'Farming Simulator 22',category:'Gry',price:35,icon:'🚜'},{name:'Słuchawki',category:'Elektronika',price:30,icon:'🎧'},{name:'Lampka LED',category:'Dom i ogród',price:18,icon:'💡'}];
let page='list',tick=null;
const money=n=>Number(n).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}render()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function art(it,large=false){const icons={'Karty piłkarskie':'⚽','Karty koszykarskie':'🏀','Ubrania':'👕','Gry':'🎮','Elektronika':'🎧','Dom i ogród':'🪴','Inne':'📦'};const icon=icons[it.category]||'📦';return `<div class="thumb ${large?'large':''}"><div class="product-art"><span>${icon}</span></div></div>`}
function render(){
 document.getElementById('itemCount').textContent=state.items.length?`(${state.items.length})`:'';
 let unread=state.messages.filter(m=>m.status==='pending').length;
 document.getElementById('msgCount').textContent=unread?`(${unread})`:'';
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 let c=document.getElementById('content');
 if(page==='list') { const owned=state.inventory.filter(x=>x.qty>0); c.innerHTML=`<h1>Wystaw przedmiot</h1><p class="sub">Możesz wystawić tylko rzeczy, które masz w szafie.</p>`+(owned.length?`<form class="panel" id="listingForm"><label for="inventoryId">Wybierz przedmiot z szafy</label><select id="inventoryId" required>${owned.map(x=>`<option value="${x.id}">${esc(x.name)} · mam ${x.qty} szt. · kupiono za ${money(x.buyPrice)} zł/szt.</option>`).join('')}</select><div id="buyPriceHint" class="pill">Cena zakupu: ${money(owned[0].buyPrice)} zł/szt.</div><div class="grid"><div><label for="qty">Ilość sztuk</label><input id="qty" type="number" min="1" max="${owned[0].qty}" value="1" required></div><div><label for="price">Cena sprzedaży za sztukę (zł)</label><input id="price" type="number" min=".01" step=".01" placeholder="np. 15" required></div></div><label for="sellMode">Jak wystawić kilka sztuk?</label><select id="sellMode"><option value="together">Razem – jedno ogłoszenie</option><option value="separate">Osobno – oddzielne ogłoszenia</option></select><label for="delay">Kiedy mają przychodzić wiadomości?</label><select id="delay"><option value="5-15m">5–15 minut</option><option value="15-30m">15–30 minut</option><option value="30-60m">30 minut – 1 godzina</option><option value="1-2h">1–2 godziny</option><option value="2-4h">2–4 godziny</option><option value="4-8h">4–8 godzin</option><option value="8-12h">8–12 godzin</option><option value="12-24h">12–24 godziny</option><option value="24-48h">1–2 dni</option><option value="48-72h">2–3 dni</option><option value="random">Losowo: 5 minut – 3 dni</option></select><button class="btn" style="width:100%;margin-top:18px">＋ Wystaw ogłoszenie</button></form>`:'<div class="panel empty"><strong>Twoja szafa jest pusta</strong>Najpierw kup coś w sklepie, dopiero potem wystawisz to na sprzedaż.</div>'); }
 if(page==='shop'){c.innerHTML='<h1>Sklep</h1><p class="sub">Kupuj wirtualne przedmioty, żeby dodać je do swojej szafy.</p>'+shopStock.map((x,i)=>`<div class="panel"><div class="item"><div class="thumb large"><div class="product-art"><span>${x.icon}</span></div></div><div class="itemmain"><div class="itemname">${esc(x.name)}</div><div class="muted">${esc(x.category)}</div><div class="price">${money(x.price)} zł / szt.</div><label for="buyqty${i}">Ilość</label><input id="buyqty${i}" type="number" min="1" max="99" value="1"></div></div><div class="actions"><button class="btn" onclick="buyItem(${i})">Kup i dodaj do szafy</button></div></div>`).join('')}
 if(page==='wardrobe'){c.innerHTML='<h1>Moja szafa</h1><p class="sub">Tutaj są przedmioty kupione w sklepie. Cena zakupu pozostaje widoczna.</p>'+(state.inventory.length?state.inventory.map(x=>`<div class="panel"><div class="item"><div class="thumb large"><div class="product-art"><span>${categoryIcon(x.category)}</span></div></div><div class="itemmain"><div class="itemname">${esc(x.name)}</div><div class="muted">${esc(x.category)} · dostępne: ${x.qty} szt.</div><div class="price">Kupiono za ${money(x.buyPrice)} zł / szt.</div></div></div></div>`).join(''):'<div class="panel empty"><strong>Szafa jest pusta</strong>Przedmioty kupisz w sklepie.</div>')}
 if(page==='items') { const activeItems=state.items.filter(it=>it.status==='active'&&it.qty>0); c.innerHTML=`<h1>Twoje ogłoszenia</h1><p class="sub">Aktywne produkty, wyświetlenia i polubienia.</p>`+(activeItems.length?activeItems.map(it=>`<div class="panel"><div class="item">${art(it,true)}<div class="itemmain"><div class="itemname">${esc(it.name)}</div><div class="muted">${esc(it.category)} · dostępne: ${it.qty} szt.</div><div class="price">${money(it.price)} zł / szt.</div><div class="stats"><span class="stat">👁 ${it.views||0} wyświetleń</span><span class="stat">♥ ${it.likes||0} polubień</span></div><span class="pill">Aktywne</span><div class="muted">Dodano: ${new Date(it.created).toLocaleString('pl-PL')}</div></div></div><div class="actions"><button class="btn secondary" onclick="changePrice('${it.id}')">Zmień cenę</button><button class="btn danger" onclick="removeItem('${it.id}')">Zakończ</button></div></div>`).join(''):'<div class="panel empty"><strong>Brak aktywnych ogłoszeń</strong>Sprzedane i zakończone produkty znikają z tej listy.</div>'); }
 if(page==='messages') {
   const statusLabel={accepted:'Zaakceptowano',declined:'Odrzucono',countered:'Wysłano kontrofertę',done:'Zakończono'};
   const cards=state.messages.slice().sort((a,b)=>b.created-a.created).map(m=>{
     const kind=m.type==='offer'?'Propozycja ceny':m.type==='buy'?'Chęć zakupu':'Informacja';
     const qtyText=m.qty>1?' · '+m.qty+' szt.':'';
     const offerButton=m.type==='offer'?'<button type="button" class="btn secondary" onclick="counter(\''+m.id+'\')">Zaproponuj swoją cenę</button>':'';
     const actions=m.status==='pending'
       ? '<div class="actions"><button type="button" class="btn" onclick="accept(\''+m.id+'\')">Zaakceptuj</button>'+offerButton+'<button type="button" class="btn danger" onclick="decline(\''+m.id+'\')">Odmów</button></div>'
       : '<span class="pill">'+(statusLabel[m.status]||'Zakończono')+'</span>';
     const listPrice=m.listPrice??(state.items.find(x=>x.id===m.itemId)?.price??m.offerPrice);return '<div class="panel"><div class="toprow"><strong>'+esc(m.buyer)+'</strong><div style="display:flex;align-items:center;gap:10px"><span class="small">'+new Date(m.created).toLocaleString('pl-PL')+'</span><button type="button" class="btn danger" style="padding:6px 9px" onclick="deleteMessage(\''+m.id+'\')" aria-label="Usuń wiadomość">Usuń</button></div></div><p style="margin:8px 0">'+esc(m.text)+'</p><div class="item"><div class="thumb"><div class="product-art"><span>🛍️</span></div></div><div class="itemmain"><div class="itemname">'+esc(m.itemName)+'</div><div class="muted">'+kind+qtyText+'</div><div class="message-prices"><div class="pricebox"><div class="muted">Twoja cena w ogłoszeniu</div><strong>'+money(listPrice)+' zł</strong></div><div class="pricebox"><div class="muted">Cena kupującego</div><strong>'+money(m.offerPrice)+' zł</strong></div></div></div></div>'+actions+'</div>';
   }).join('');
   c.innerHTML='<h1>Wiadomości</h1><p class="sub">Oferty i zakupy od wirtualnych kupujących.</p>'+(state.messages.length?cards:'<div class="panel empty"><strong>Na razie cisza</strong>Wiadomości pojawią się po pewnym czasie. Symulator nie musi od razu robić z Ciebie magnata handlu.</div>');
 }
}
function navigate(nextPage){page=nextPage;render();window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{const b=e.target.closest('.nav button[data-page]');if(!b)return;navigate(b.dataset.page);});
document.addEventListener('change',e=>{if(e.target.id==='inventoryId'){const x=state.inventory.find(i=>i.id===e.target.value);if(x){document.getElementById('qty').max=x.qty;document.getElementById('qty').value=1;document.getElementById('buyPriceHint').textContent='Cena zakupu: '+money(x.buyPrice)+' zł/szt.';}}});
function categoryIcon(cat){return ({'Karty piłkarskie':'⚽','Karty koszykarskie':'🏀','Ubrania':'👕','Gry':'🎮','Elektronika':'🎧','Dom i ogród':'🪴','Inne':'📦'})[cat]||'📦'}
function buyItem(i){const p=shopStock[i];let qty=Math.max(1,Math.min(99,Number(document.getElementById('buyqty'+i).value)||1));let existing=state.inventory.find(x=>x.stockName===p.name);if(existing){existing.qty+=qty;}else{state.inventory.push({id:'inv'+Date.now()+Math.random(),stockName:p.name,name:p.name,category:p.category,buyPrice:p.price,qty});}save();toast('Kupiono '+qty+' szt. i dodano do szafy');}
document.addEventListener('submit',e=>{if(e.target.id!=='listingForm')return;e.preventDefault();let inv=state.inventory.find(x=>x.id===document.getElementById('inventoryId').value);let qty=Number(document.getElementById('qty').value),price=Number(document.getElementById('price').value);if(!inv||qty<1||qty>inv.qty||price<=0)return;let delay=document.getElementById('delay').value;let range=delay==='random'?[5,4320]:delay.endsWith('m')?delay.slice(0,-1).split('-').map(Number):delay.endsWith('h')?delay.slice(0,-1).split('-').map(Number).map(n=>n*60):delay.split('-').map(Number).map(n=>n*1440);let mode=document.getElementById('sellMode').value;let count=mode==='separate'?Math.min(qty,100):1;let now=Date.now();for(let i=0;i<count;i++){let id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+'_'+i;let nextDelay=(range[0]+Math.random()*(range[1]-range[0]))*60000;state.items.push({id,name:mode==='separate'?`${inv.name} (${i+1}/${count})`:inv.name,inventoryId:inv.id,buyPrice:inv.buyPrice,qty:mode==='separate'?1:qty,price,category:inv.category,status:'active',created:now,nextMessage:now+nextDelay,delayRange:range,messagesMade:0,sellMode:mode,views:0,likes:0,lastStatsAt:now});}inv.qty-=qty;save();page='items';render();toast('Wystawiono przedmiot z szafy!')});
function removeItem(id){let it=state.items.find(x=>x.id===id);if(it&&it.status==='active'){it.status='ended';let inv=state.inventory.find(x=>x.id===it.inventoryId);if(inv)inv.qty+=it.qty;}save();toast('Ogłoszenie zakończone, niesprzedane sztuki wróciły do szafy')}
function changePrice(id){let it=state.items.find(x=>x.id===id);if(!it)return;let p=prompt('Nowa cena za sztukę (zł):',it.price);if(p!==null&&Number(p)>0){it.price=Number(p);save();toast('Cena zmieniona')}}
function decline(id){let m=state.messages.find(x=>x.id===id);if(m)m.status='declined';save()}
function deleteMessage(id){state.messages=state.messages.filter(m=>m.id!==id);save();toast('Wiadomość usunięta')}
function accept(id){let m=state.messages.find(x=>x.id===id);if(!m||m.status!=='pending')return;let it=state.items.find(x=>x.id===m.itemId);m.status='accepted';if(it&&it.status==='active'){let q=Math.min(it.qty,m.qty||1);it.qty-=q;if(it.qty<=0)it.status='sold';state.messages.push({id:'info'+Date.now(),itemId:it.id,itemName:it.name,buyer:'System',text:`Transakcja zakończona w symulatorze. Sprzedano ${q} szt. produktu.${it.status==='sold'?' Ogłoszenie usunięto z aktywnych ogłoszeń.':''}`,offerPrice:m.offerPrice,listPrice:m.listPrice??it.price,qty:q,type:'info',status:'done',created:Date.now()})}save();toast('Oferta zaakceptowana')}
function counter(id){let m=state.messages.find(x=>x.id===id);if(!m)return;let p=prompt('Twoja cena za sztukę (zł):',m.offerPrice+1);if(p!==null&&Number(p)>0){m.status='countered';state.messages.push({id:'counter'+Date.now(),itemId:m.itemId,itemName:m.itemName,buyer:m.buyer,text:'Wysłałeś kontrofertę. Kupujący może odpowiedzieć później.',offerPrice:Number(p),qty:m.qty,type:'info',status:'done',created:Date.now()});save();toast('Kontroferta zapisana')}}
function updateStats(){let now=Date.now(),changed=false;for(const it of state.items){if(it.status!=='active'||it.qty<=0)continue;if(it.views===undefined)it.views=0;if(it.likes===undefined)it.likes=0;if(!it.lastStatsAt)it.lastStatsAt=it.created||now;const hours=Math.max(0,(now-it.lastStatsAt)/3600000);if(hours>=0.05){it.views+=Math.floor(hours*(0.5+Math.random()*2.2));if(Math.random()<Math.min(0.8,hours*0.16))it.likes++;it.lastStatsAt=now;changed=true;}}return changed;}
function generateMessages(){let now=Date.now();let statsChanged=updateStats();let due=state.items.filter(it=>it.status==='active'&&it.nextMessage<=now&&it.qty>0);for(let it of due){let names=['Kuba_2013','KartowyFan','MajaShop','footballcollector','KolekcjonerPL','SecondHand_88','ToppsFan'];let buyer=names[Math.floor(Math.random()*names.length)];let isOffer=Math.random()<.68;let qty=1;let price=isOffer?Math.max(.01,Math.round(it.price*(.65+Math.random()*.28)*100)/100):it.price;let phrases=isOffer?['Hej, przyjmiesz taką cenę?','Mogę dać tyle od ręki.','Jest szansa na małą negocjację?','Daj znać, czy pasuje taka oferta.']:['Cześć, chcę kupić ten produkt.','Czy ogłoszenie jest aktualne?','Biorę po cenie z ogłoszenia.'];state.messages.push({id:'m'+Date.now()+Math.random(),itemId:it.id,itemName:it.name,buyer,text:isOffer?phrases[Math.floor(Math.random()*phrases.length)]:phrases[Math.floor(Math.random()*phrases.length)],offerPrice:price,listPrice:it.price,qty,type:isOffer?'offer':'buy',status:'pending',created:now});it.messagesMade++;let range=Array.isArray(it.delayRange)&&it.delayRange.length===2?it.delayRange:[30,1440];it.nextMessage=now+(range[0]+Math.random()*(range[1]-range[0]))*60000;}
if(due.length||statsChanged){save();if(due.length&&page!=='messages')toast('Masz nową wiadomość!')}}
// Dane są zapisywane w localStorage po każdej zmianie. Przy zamknięciu zapisujemy je ponownie.
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}});
window.addEventListener('pageshow',()=>{generateMessages();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)generateMessages();});
// Sprawdź od razu po otwarciu, czy podczas nieobecności minął termin wiadomości.
generateMessages();
render();
tick=setInterval(generateMessages,15000);
</script></body></html>
